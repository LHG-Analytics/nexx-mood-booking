name: Deploy Motels (Unified)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Docker Swarm via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          MAXMIND_ACCOUNT_ID: ${{ secrets.MAXMIND_ACCOUNT_ID }}
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: MAXMIND_ACCOUNT_ID,MAXMIND_LICENSE_KEY
          script: |
            # GeoLite2 City (MaxMind) for "nearest Nexx unit by IP". It stays on
            # the server and is mounted into the container read-only: the image
            # is pushed to GHCR from a public repo, and the GeoLite2 licence
            # doesn't allow redistributing the database. Refreshed weekly;
            # skipped entirely when the secrets aren't set (the site then falls
            # back to the visitor's saved choice or the first unit).
            GEO_DIR=/opt/stacks/unified/geo
            mkdir -p "$GEO_DIR"
            if [ -n "$MAXMIND_LICENSE_KEY" ] && { [ ! -f "$GEO_DIR/GeoLite2-City.mmdb" ] || [ -n "$(find "$GEO_DIR/GeoLite2-City.mmdb" -mtime +7)" ]; }; then
              TMP=$(mktemp -d)
              if curl -fsSL -u "$MAXMIND_ACCOUNT_ID:$MAXMIND_LICENSE_KEY"                   "https://download.maxmind.com/geoip/databases/GeoLite2-City/download?suffix=tar.gz" -o "$TMP/geo.tar.gz"                 && tar -xzf "$TMP/geo.tar.gz" -C "$TMP" --wildcards --strip-components=1 '*/GeoLite2-City.mmdb'; then
                mv "$TMP/GeoLite2-City.mmdb" "$GEO_DIR/GeoLite2-City.mmdb"
                echo "GeoLite2 updated"
              else
                echo "GeoLite2 download failed; keeping the previous copy if any"
              fi
              rm -rf "$TMP"
            fi

            # Pull latest image
            docker pull ghcr.io/lhg-analytics/nexx-mood-booking:latest

            # Deploy unified stack
            cd /opt/stacks/unified
            docker stack deploy -c docker-compose.unified.yml motels --with-registry-auth

            # Wait for deployment
            sleep 10

            # Show service status
            docker service ls | grep motels
            docker service ps motels_motels-web --no-trunc
